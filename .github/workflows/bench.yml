name: SeekDB FTS Bench

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'report label (before / after)'
        required: false
        default: 'probe'

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
    - name: Free Disk Space
      uses: insightsengineering/disk-space-reclaimer@v1
      with:
        tools-cache: false

    - uses: actions/checkout@v3

    - name: Install ubuntu environment
      shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v3
      env:
        cache-name: cache-deps
      with:
        key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
        path: deps/3rd

    - name: Build
      uses: ./.github/workflows/buildbase
      with:
        save_cache: 'false'
        os: 'ubuntu22'

    - name: Start seekdb for benchmark
      shell: bash
      run: |
        set -euo pipefail
        sudo sysctl -w kernel.core_pattern=/tmp/core.%p >/dev/null 2>&1 || true
        ulimit -c unlimited || true
        echo "core_pattern=$(cat /proc/sys/kernel/core_pattern) ulimit_c=$(ulimit -c)"
        python3 .github/script/seekdb/bench_runner.py \
          --seekdb build_release/src/observer/seekdb \
          --obclient deps/3rd/u01/obclient/bin/obclient \
          --base-dir "$GITHUB_WORKSPACE/bench_out/instance"

    - name: Run fts benchmark
      shell: bash
      run: |
        set -o pipefail
        CLIENT="$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/obclient"
        LABEL="${{ github.event.inputs.label }}" \
        MYSQL="$CLIENT -h127.0.0.1 -P2881 -uroot -N -s --default-character-set=utf8mb4" \
        MYSQL_VERBOSE="$CLIENT -h127.0.0.1 -P2881 -uroot --default-character-set=utf8mb4" \
        OUTPUT="$GITHUB_WORKSPACE/bench_out/report.txt" \
        bash tools/benchmark/fts_large_bench.sh 2>&1 | tee bench.log

    - name: Dump observer diagnostics
      if: failure()
      shell: bash
      run: |
        LOGDIR="$GITHUB_WORKSPACE/bench_out/instance/log"
        echo "=== log dir ==="
        ls -la "$LOGDIR" 2>&1 || true
        for f in "$LOGDIR"/*.log*; do
          [ -f "$f" ] || continue
          echo "=== $f : $(wc -l < "$f") lines ==="
          grep -nE "SIGSEGV|SIGABRT|SIGBUS|ASSERT|assert fail|backtrace|errcode=-4[0-9]{3}|\] ERROR |FATAL" "$f" | tail -40 || true
          echo "--- tail 40 ---"
          tail -40 "$f" | cut -c1-260 || true
        done
        echo "=== cores ==="
        ls -la /tmp/core.* 2>/dev/null || echo "no core file"
        echo "=== gdb ==="
        if ! command -v gdb >/dev/null 2>&1; then
          echo "--- apt update ---"
          sudo apt-get update 2>&1 | tail -5 || true
          echo "--- apt install ---"
          sudo apt-get install -y --no-install-recommends gdb 2>&1 | tail -5 || true
        fi
        echo "--- which ---"
        ls -la /usr/bin/gdb* 2>/dev/null || echo "no /usr/bin/gdb"
        command -v gdb || echo "gdb unavailable"
        command -v lldb || echo "lldb unavailable"
        file build_release/src/observer/seekdb | cut -c1-200
        echo "=== stack ==="
        for c in /tmp/core.*; do
          [ -f "$c" ] || continue
          if command -v gdb >/dev/null 2>&1; then
            gdb -batch -nx -iex "set pagination off" -iex "set print frame-arguments none" \
              -ex "thread apply all bt 25" \
              -ex "bt 60" \
              build_release/src/observer/seekdb "$c" 2>&1 | tail -200 || true
          elif command -v lldb >/dev/null 2>&1; then
            lldb -c "$c" --batch -o "thread backtrace all" -o "bt 60" \
              build_release/src/observer/seekdb 2>&1 | tail -200 || true
          else
            echo "no debugger available"
          fi
          break
        done
        echo "=== kernel ==="
        dmesg 2>/dev/null | tail -15 || true

    - name: Score against the checked-in baseline
      if: always()
      shell: bash
      run: |
        if [[ -f bench_out/report.txt ]]; then
          python3 tools/benchmark/fts_large_bench_score.py bench_out/report.txt \
            --allow-config-mismatch 2>&1 | tee bench_out/score.txt
        else
          echo "no report produced" | tee bench_out/score.txt
        fi

    - name: Stop seekdb
      if: always()
      shell: bash
      run: |
        python3 .github/script/seekdb/sdb.py stop \
          --base-dir "$GITHUB_WORKSPACE/bench_out/instance" || true

    - name: Upload bench output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seekdb-fts-bench
        path: |
          bench.log
          bench_out/report.txt
          bench_out/score.txt
          bench_out/instance/log/*.log
        if-no-files-found: warn
